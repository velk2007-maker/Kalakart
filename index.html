<script>

  // Real tabs (live preview, downloaded code) keep true viewport units.

  // fallback — a broken-image icon must never ship.

      setTimeout(function () { el.src = src + (src.indexOf('?') > -1 ? '&' : '?') + 'v3r=' + Date.now(); }, wait);
    } else {

      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;

          else if (/^min-h-(screen|dvh|svh|lvh)$/.test(c)) el.style.setProperty('min-height', '900px', 'important');
          else if (/^max-h-(screen|dvh|svh|lvh)$/.test(c)) el.style.setProperty('max-height', '900px', 'important');
          else if ((m = c.match(/^h-[(d+)(?:d|s|l)?vh]$/))) el.style.setProperty('height', (m[1] * PX_PER_VH) + 'px', 'important');

    // stored document (the live DOM already shows the edit — no reload).

    // headlines) — anything with real child markup keeps its styling safe.

      var same = [].filter.call(document.querySelectorAll(t.tagName), function (n) {

<script>
  // Framer-motion-style entrance: top-level sections/cards fade-slide in with
  // a stagger as they scroll into view; on marketing pages each section's own
  // content (headlines, copy, images, cards) staggers in too. Deterministic —
  // never model-written.
  addEventListener('DOMContentLoaded', () => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    // App chrome (sidebars, navs, tab bars, headers) must NEVER be animated —
    // only page content. In app shells animate the main column's children;
    // on marketing pages animate top-level sections.
    const isAppShell = !!document.querySelector('aside, [class*="h-screen"]');
    let targets;
    if (isAppShell) {
      const main = document.querySelector('main') || document.body;
      targets = Array.from(main.children).filter(el => !['HEADER', 'NAV', 'ASIDE'].includes(el.tagName));
      // If main has a single content wrapper, animate its children instead
      if (targets.length === 1 && targets[0].children.length > 1) targets = Array.from(targets[0].children);
    } else {
      const roots = document.querySelectorAll('body > section, body > footer, body > div > section, body > div > footer, main > section');
      targets = roots.length > 1 ? Array.from(roots) : [];
    }
    // Marketing sections: stagger the section's content row-by-row. Descend
    // through single-wrapper containers to the real content children.
    const markChildren = (section) => {
      let root = section;
      while (root.children.length === 1 && root.children[0].children.length) root = root.children[0];
      const kids = Array.from(root.children).filter(k => !['SCRIPT', 'STYLE'].includes(k.tagName)).slice(0, 10);
      if (kids.length < 2) return;
      kids.forEach((k, i) => {
        k.classList.add('v3-reveal');
        k.style.transitionDelay = Math.min(i * 80, 480) + 'ms';
      });
    };
    let order = 0;
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const el = e.target;
        setTimeout(() => {
          el.classList.add('v3-in');
          el.querySelectorAll('.v3-reveal').forEach(k => k.classList.add('v3-in'));
        }, (order++ % 4) * 90);
        io.unobserve(el);
      }
    }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
    targets.forEach(el => {
      if (['SCRIPT', 'STYLE', 'NAV', 'ASIDE', 'HEADER'].includes(el.tagName)) return;
      el.classList.add('v3-reveal');
      if (!isAppShell) markChildren(el);
      io.observe(el);
    });
    // Safety: anything hidden but already inside the viewport after 1.5s
    // becomes visible. Below-the-fold content stays armed so the reveal
    // still plays when the user scrolls to it.
    setTimeout(() => {
      document.querySelectorAll('.v3-reveal:not(.v3-in)').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < innerHeight && r.bottom > 0) el.classList.add('v3-in');
      });
    }, 1500);
    // Buttery inertia scrolling (Lenis) on marketing pages — app shells keep
    // native scrolling for their inner panels.
    if (!isAppShell && document.body.scrollHeight > innerHeight * 1.2) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js';
      s.onload = () => {
        try {
          document.documentElement.style.scrollBehavior = 'auto'; // Lenis replaces CSS smooth scroll
          const lenis = new Lenis({ duration: 1.1, smoothWheel: true, anchors: true });
          const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
          requestAnimationFrame(raf);
        } catch (err) { /* native scrolling still works */ }
      };
      document.head.appendChild(s);
    }
  });
</script>
<script>
  // One-time confetti burst for celebration/success moments. The model marks
  // the moment with a bare data-confetti attribute — no JS, no external
  // library (Lottie/canvas-confetti CDNs are never loaded in this shell and
  // would render broken/static). Fires exactly once per element, on-brand
  // colors, self-cleans — never a loop.
  addEventListener('DOMContentLoaded', () => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const v3ConfettiColors = ['#3B82F6', '#F4C542', '#3B82F6', '#161D1A'];
    document.querySelectorAll('[data-confetti]').forEach((el) => {
      el.removeAttribute('data-confetti');
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const pieces = [];
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 26; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 120;
        const p = document.createElement('span');
        p.className = 'v3-confetti-piece';
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.background = v3ConfettiColors[i % v3ConfettiColors.length];
        p.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
        p.style.setProperty('--v3cx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--v3cy', (Math.sin(angle) * dist - 40) + 'px');
        p.style.setProperty('--v3cr', (Math.random() * 480 - 240) + 'deg');
        p.style.animationDelay = (Math.random() * 120) + 'ms';
        frag.appendChild(p);
        pieces.push(p);
      }
      document.body.appendChild(frag);
      setTimeout(() => pieces.forEach((p) => p.remove()), 1500);
    });
  });
</script>
<script>
  // Selective hero background: a lightweight Canvas2D animated gradient-blob
  // field (never WebGL/Three.js — deliberately cheap, deterministic, and
  // impossible for the model to get wrong since it never writes the canvas
  // code itself). The model only opts a hero section in via a bare
  // data-hero-canvas attribute; this mounts and animates it in this DNA's
  // own accent colors. z-index:-1 keeps it behind normal in-flow content
  // without needing to touch the model's own markup.
  addEventListener('DOMContentLoaded', () => {
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const heroColors = ['#3B82F6', '#F4C542', '#3B82F6'];
    document.querySelectorAll('[data-hero-canvas]').forEach((el) => {
      el.removeAttribute('data-hero-canvas');
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;inset:0;z-index:-1;pointer-events:none;filter:blur(60px);';
      el.prepend(canvas);
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(devicePixelRatio || 1, 2);
      function resize() {
        canvas.width = Math.max(1, el.clientWidth * dpr);
        canvas.height = Math.max(1, el.clientHeight * dpr);
        canvas.style.width = el.clientWidth + 'px';
        canvas.style.height = el.clientHeight + 'px';
      }
      resize();
      addEventListener('resize', resize);
      const blobs = heroColors.map(() => ({
        color: heroColors[Math.floor(Math.random() * heroColors.length)],
        baseX: 0.2 + Math.random() * 0.6,
        baseY: 0.2 + Math.random() * 0.6,
        r: 0.32 + Math.random() * 0.22,
        speed: 0.00012 + Math.random() * 0.00008,
        phase: Math.random() * Math.PI * 2,
        driftX: 0.12 + Math.random() * 0.08,
        driftY: 0.10 + Math.random() * 0.06
      }));
      function paint(t) {
        const w = canvas.width, h = canvas.height;
        if (!w || !h) return;
        ctx.clearRect(0, 0, w, h);
        blobs.forEach((b) => {
          const x = (b.baseX + Math.sin(t * b.speed + b.phase) * b.driftX) * w;
          const y = (b.baseY + Math.cos(t * b.speed * 0.8 + b.phase) * b.driftY) * h;
          const r = b.r * Math.max(w, h);
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, b.color + '55');
          g.addColorStop(1, b.color + '00');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      if (reduceMotion) {
        paint(0);
      } else {
        const loop = (t) => { paint(t); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
      }
    });
  });
</script>

<script>

function kalakartApp() {
  return {
    page: 'login',
    dashTab: 'overview',
    selectedProduct: 0,
    lastOrder: null,
    user: null,
    token: localStorage.getItem('kalakart_token') || '',
    authMode: 'login',
    role: 'artisan',
    email: '',
    password: '',
    name: '',
    authError: '',
    loading: false,
    myProducts: [],
    myOrders: [],
    analytics: {
      personal: {products:0, orders:0, buyers:0, revenue:0},
      marketplace: {hasData:false, topCategories:[]}
    },
    assistantInput: '',
    assistantBusy: false,
    assistantMessages: [{role:'assistant', text:'Hi! Ask me about your products, orders, or marketplace data.'}],
    messages: [],
    unreadMessages: 0,
    selectedMessageUserId: '',
    selectedMessageName: '',
    messageText: '',
    messageSending: false,
    messageError: '',
    products: [],
    marketSearch: '', marketCategory: 'All', marketSort: 'Newest first',
    formatINR(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); },
    async api(path, options={}) {
      const headers = Object.assign({'Content-Type':'application/json'}, options.headers || {});
      if (this.token) headers.Authorization = 'Bearer ' + this.token;
      const res = await fetch(path, Object.assign({}, options, {headers}));
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    },
    async initApp() {
      if (!this.token) return;
      try {
        const data = await this.api('/api/me');
        this.user = data.user;
        if (this.user.role === 'artisan') {
          this.page='dashboard'; this.dashTab='overview'; await this.refreshDashboard();
        } else {
          this.page='browse'; await this.loadMarketplace();
        }
      } catch (_) {
        this.token=''; localStorage.removeItem('kalakart_token');
      }
    },
    async login() {
      this.authError=''; this.loading=true;
      try {
        const data=await this.api('/api/auth/login',{method:'POST',body:JSON.stringify({email:this.email,password:this.password,role:this.role})});
        this.token=data.token; localStorage.setItem('kalakart_token',this.token); this.user=data.user;
        if (this.user.role==='artisan') { this.page='dashboard'; this.dashTab='overview'; await this.refreshDashboard(); }
        else { this.page='browse'; await this.loadMarketplace(); }
      } catch(e) { this.authError=e.message; }
      finally { this.loading=false; }
    },
    async register() {
      this.authError=''; this.loading=true;
      try {
        const data=await this.api('/api/auth/register',{method:'POST',body:JSON.stringify({name:this.name,email:this.email,password:this.password,role:this.role})});
        this.token=data.token; localStorage.setItem('kalakart_token',this.token); this.user=data.user;
        if (this.user.role==='artisan') { this.page='dashboard'; this.dashTab='overview'; await this.refreshDashboard(); }
        else { this.page='browse'; await this.loadMarketplace(); }
      } catch(e) { this.authError=e.message; }
      finally { this.loading=false; }
    },
    async logout() {
      try { await this.api('/api/auth/logout',{method:'POST'}); } catch (_) {}
      this.token=''; this.user=null; localStorage.removeItem('kalakart_token'); this.page='login'; this.authMode='login'; this.email=''; this.password='';
    },
    async refreshDashboard() {
      if (!this.user || this.user.role!=='artisan') return;
      try {
        const [a,p,o]=await Promise.all([this.api('/api/analytics'),this.api('/api/products?mine=true'),this.api('/api/orders?mine=true')]);
        this.analytics=a; this.myProducts=p.products || []; this.myOrders=o.orders || []; await this.loadMessages();
      } catch(e) { console.error(e); }
    },
    conversationList() {
      const map={};
      for(const m of this.messages){ const id=m.counterparty_id; if(id) map[id]={id,name:m.counterparty_name||'User',last:m.text||''}; }
      return Object.values(map);
    },
    activeConversation() { return this.messages.filter(m=>m.counterparty_id===this.selectedMessageUserId); },
    async loadMessages(userId='') {
      if(!this.user) return;
      try { const d=await this.api('/api/messages'+(userId?'?user_id='+encodeURIComponent(userId):'')); this.messages=d.messages||[]; this.unreadMessages=Number(d.unread||0); }
      catch(e) { this.messageError=e.message; }
    },
    async openMessages(userId='', name='') {
      if(!this.user){ this.page='login'; this.authError='Please sign in to use messages.'; return; }
      this.page='messages'; this.messageError=''; this.selectedMessageUserId=userId||this.selectedMessageUserId; this.selectedMessageName=name||this.selectedMessageName;
      await this.loadMessages(this.selectedMessageUserId);
      if(this.selectedMessageUserId){ const c=this.conversationList().find(x=>x.id===this.selectedMessageUserId); if(c) this.selectedMessageName=c.name; }
    },
    async selectConversation(id) { const c=this.conversationList().find(x=>x.id===id); this.selectedMessageUserId=id; this.selectedMessageName=c?.name||'User'; this.messageError=''; await this.loadMessages(id); },
    async sendMessage() {
      const text=this.messageText.trim(); if(!text||!this.selectedMessageUserId||this.messageSending) return;
      this.messageSending=true; this.messageError='';
      try { await this.api('/api/messages',{method:'POST',body:JSON.stringify({recipient_id:this.selectedMessageUserId,text})}); this.messageText=''; await this.loadMessages(this.selectedMessageUserId); }
      catch(e) { this.messageError=e.message; } finally { this.messageSending=false; }
    },
    async messageArtisan(product) {
      if(!this.user){ this.page='login'; this.role='buyer'; this.authMode='login'; this.authError='Sign in as a buyer to message the artisan.'; return; }
      if(this.user.role!=='buyer'){ this.page='messages'; return; }
      this.selectedMessageUserId=product.owner_id; this.selectedMessageName=product.artisan||'Artisan'; this.messageText=''; this.messageError=''; this.page='messages'; await this.loadMessages(product.owner_id);
    },
    async loadMarketplace() {
      try { const d=await this.api('/api/products'); this.products=d.products || []; } catch(e) { console.error(e); }
    },
    async askAssistant() {
      const q=this.assistantInput.trim(); if(!q || this.assistantBusy) return;
      this.assistantMessages.push({role:'user',text:q}); this.assistantInput=''; this.assistantBusy=true;
      try {
        const d=await this.api('/api/ai/assistant',{method:'POST',body:JSON.stringify({question:q})});
        this.assistantMessages.push({role:'assistant',text:d.answer});
      } catch(e) { this.assistantMessages.push({role:'assistant',text:e.message}); }
      finally { this.assistantBusy=false; }
    },
    visibleProducts() {
      const q=this.marketSearch.trim().toLowerCase();
      let list=this.products.filter(p => (this.marketCategory==='All' || p.category===this.marketCategory) && (!q || [p.title,p.description,p.category,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));
      if(this.marketSort==='Price: low to high') list.sort((a,b)=>Number(a.price)-Number(b.price));
      else if(this.marketSort==='Price: high to low') list.sort((a,b)=>Number(b.price)-Number(a.price));
      else list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      return list;
    },
    selectProduct(i) { this.selectedProduct=i; this.page='product-detail'; window.scrollTo(0,0); },
    selectProductById(id) { const i=this.products.findIndex(p=>p.id===id); if(i>=0) this.selectProduct(i); },
    startMarketplaceVoiceSearch() {
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR) { alert('Voice search is not supported in this browser. Try Chrome or Edge.'); return; }
      const r=new SR(); r.lang='en-IN'; r.continuous=false; r.interimResults=false; r.onresult=e=>{this.marketSearch=e.results[0][0].transcript;}; r.start();
    },
    isSaved(product) { return JSON.parse(localStorage.getItem('kalakart_saved_products') || '[]').includes(product?.id); },
    saveProduct(product) { const key='kalakart_saved_products'; const list=JSON.parse(localStorage.getItem(key)||'[]'); const next=list.includes(product.id)?list.filter(x=>x!==product.id):[...list,product.id]; localStorage.setItem(key,JSON.stringify(next)); },
    async shareProduct(product) { const text=product?.title || 'Kalakart craft'; try { if(navigator.share) await navigator.share({title:text,text:'Discover this handmade product on Kalakart.'}); else await navigator.clipboard.writeText(text); } catch(_){} },
    async placeOrder(product) {
      if (!this.token || !this.user) { this.page='login'; this.authMode='login'; this.role='buyer'; this.authError='Sign in as a buyer to place an order.'; return; }
      try {
        const d=await this.api('/api/orders',{method:'POST',body:JSON.stringify({product_id:product.id})});
        this.lastOrder=d.order; this.page='order-confirmation'; window.scrollTo(0,0);
      } catch(e) { alert(e.message); }
    },
    openDashboard() {
      if (this.user?.role==='artisan') { this.page='dashboard'; this.dashTab='overview'; this.refreshDashboard(); }
      else { this.page='login'; this.role='artisan'; this.authMode='login'; }
    }
  };
}

function addProduct() {
  return {
    draftState: 'saved', voiceState: 'ready', generating: false, publishing: false, published: false,
    editingTranscript: false, uploadError: false, uploadErrorMsg: '', voiceError: false,
    priceWarning: false, finalPrice: '', stock: 1, materials: '', transcript: '', title: '', description: '', category: 'Home',
    newTag: '', tags: [], photos: [], aiVision: '', aiBusy: false, voiceLanguage: 'en-IN',
    recognition: null,
    async api(path, options={}) {
      const headers=Object.assign({'Content-Type':'application/json'},options.headers||{});
      const token=localStorage.getItem('kalakart_token'); if(token) headers.Authorization='Bearer '+token;
      const res=await fetch(path,Object.assign({},options,{headers})); let data={}; try{data=await res.json()}catch(_){}
      if(!res.ok) throw new Error(data.error||'Request failed'); return data;
    },
    toggleMic() {
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR) { this.voiceError=true; this.voiceState='ready'; this.transcript='Speech recognition is not supported in this browser. Try Chrome or Edge.'; return; }
      if(this.voiceState==='listening') { try{this.recognition?.stop()}catch(_){}; return; }
      this.voiceError=false; this.voiceState='listening';
      const r=new SR(); this.recognition=r; r.lang=this.voiceLanguage; r.continuous=false; r.interimResults=true;
      let finalText=this.transcript && !this.transcript.includes('Speech recognition') ? this.transcript.trim()+' ' : '';
      r.onresult=(e)=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript; if(e.results[i].isFinal) finalText+=s+' '; else interim+=s;} this.transcript=(finalText+interim).trim(); };
      r.onerror=()=>{this.voiceError=true;this.voiceState='ready';};
      r.onend=()=>{this.voiceState=this.transcript.trim()?'done':'ready';};
      try{r.start()}catch(_){this.voiceState='ready';}
    },
    resetVoice(){ this.voiceState='ready'; this.transcript=''; },
    async identifyImage() {
      if(!this.photos.length) { this.aiVision='Upload a product photo first.'; return; }
      this.aiBusy=true; this.aiVision='';
      try { const d=await this.api('/api/ai/identify',{method:'POST',body:JSON.stringify({image:this.photos[0].src})}); this.aiVision=d.result || 'No identification returned.'; }
      catch(e){this.aiVision=e.message;}
      finally{this.aiBusy=false;}
    },
    async generateListing() {
      if(!this.transcript.trim() && !this.photos.length) { this.voiceError=true; this.aiVision='Add a photo or describe the product by voice/text first.'; return; }
      this.voiceError=false; this.generating=true;
      try {
        const d=await this.api('/api/ai/listing',{method:'POST',body:JSON.stringify({image:this.photos[0]?.src||null, transcript:this.transcript, vision:this.aiVision})});
        this.title=d.title||this.title; this.description=d.description||this.description; this.category=d.category||this.category;
        this.tags=Array.isArray(d.tags)?d.tags:this.tags; this.materials=d.materials||this.materials; if(d.price) this.finalPrice=String(d.price);
      } catch(e){ this.aiVision=e.message; }
      finally{this.generating=false;}
    },
    removePhoto(i){this.photos.splice(i,1);},
    removeTag(i){this.tags.splice(i,1);},
    addTag(){const x=(this.newTag||'').trim();if(x)this.tags.push(x);this.newTag='';},
    handleFiles(fileList){
      const files=Array.from(fileList||[]);
      for(const file of files){
        if(this.photos.length>=6)break;
        if(!file.type.startsWith('image/'))continue;
        if(file.size>8*1024*1024){this.uploadErrorMsg=`"${file.name}" is too large. Please use a photo under 8 MB.`;this.uploadError=true;continue;}
        const reader=new FileReader(); reader.onload=e=>this.photos.push({src:e.target.result,name:file.name}); reader.readAsDataURL(file);
      }
    },
    checkPrice(){ this.priceWarning=false; },
    saveDraft(){ localStorage.setItem('kalakart_product_draft', JSON.stringify({title:this.title,description:this.description,category:this.category,tags:this.tags,price:this.finalPrice,stock:this.stock,transcript:this.transcript})); this.draftState='saving'; setTimeout(()=>this.draftState='saved',600); },
    async publish(){
      if(!this.title.trim()){this.aiVision='Please add a product title.';return;}
      const price=parseFloat(String(this.finalPrice).replace(/[^0-9.]/g,''))||0;
      if(price<=0){this.aiVision='Please enter a valid price before publishing.';return;}
      this.publishing=true;
      try{
        await this.api('/api/products',{method:'POST',body:JSON.stringify({
          title:this.title,description:this.description,category:this.category,tags:this.tags,price,
          stock:Math.max(1, parseInt(this.stock,10)||1),image_url:this.photos[0]?.src||null,materials:this.materials,voice_transcript:this.transcript
        })});
        this.published=true;
        this.$dispatch('refresh-dashboard');
        if(window.Alpine?.$data) { /* no-op: parent dashboard refresh occurs on tab change */ }
        setTimeout(()=>{this.published=false; this.title='';this.description='';this.tags=[];this.photos=[];this.transcript='';this.finalPrice='';this.stock=1;this.materials='';this.aiVision='';},800);
      }catch(e){this.aiVision=e.message;}
      finally{this.publishing=false;}
    }
  };
}




</script>
